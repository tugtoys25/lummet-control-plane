name: Deploy Lummet Control Plane
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reject incomplete or inconsistent lockfile
        run: node scripts/lockfile-check.mjs
      - run: npm ci --no-audit --no-fund
      - name: Run tests with per-file isolation and handle-leak enforcement
        env:
          TEST_FILE_TIMEOUT_MS: 120000
          TEST_SKIP: lockfile-check.test.js,package-phase.test.js,phase6-gate.test.js,load-d1-policies-6-5c.test.js,runbooks-restore-drill-6-5b.test.js
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-plane-per-file-test-timings-node-${{ matrix.node-version }}
          path: test-timings.md
      - run: node scripts/migrate.mjs --db lummet-control-plane-db --dry-run
      - run: node scripts/package-phase.mjs --phase 3 --version "$(node -p "require('./package.json').version")" --skip-tests --development-check
  deploy_staging:
    needs: test
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reject incomplete or inconsistent lockfile
        run: node scripts/lockfile-check.mjs
      - run: npm ci --no-audit --no-fund
      - name: Prepare isolated staging D1 binding
        env:
          STAGING_D1_DATABASE_ID: ${{ secrets.STAGING_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-staging-config.mjs
      - name: Validate staging configuration
        env:
          STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STAGING_STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
        run: node scripts/check-config.mjs --staging
      - name: Ensure isolated staging R2 buckets and Queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-staging-resources.mjs
      - name: Migration history preflight (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migration-preflight.mjs --db lummet-control-plane-staging-db --remote
      - name: Apply staging migrations after history preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migrate.mjs --db lummet-control-plane-staging-db --remote
      - name: Configure Stripe test-mode secrets on staging Worker
        env:
          STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STAGING_STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$STAGING_STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --env staging
          printf '%s' "$STAGING_STRIPE_WEBHOOK_SECRET" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --env staging
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Seed staging access states
        env:
          ENVIRONMENT: staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/seed-staging-access-states.mjs
      - name: Staging smoke checks
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: node scripts/staging-smoke.mjs
      - name: Record D1 Time Travel bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/record-d1-bookmark.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: staging-evidence
          path: d1-time-travel-bookmark.json
  deploy_production:
    if: github.ref == 'refs/heads/main' && vars.ALLOW_PRODUCTION_DEPLOY == 'true'
    needs: deploy_staging
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reject incomplete or inconsistent lockfile
        run: node scripts/lockfile-check.mjs
      - run: npm ci --no-audit --no-fund
      - name: Production configuration check
        continue-on-error: true
        env:
          CREDENTIAL_KEK: ${{ secrets.CREDENTIAL_KEK }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_CHECK_TOKEN: ${{ secrets.ALERT_CHECK_TOKEN }}
          EMAIL_PROVIDER: resend
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          WEBAUTHN_ORIGIN: ${{ vars.WEBAUTHN_ORIGIN }}
          OUTBOUND_DNS_CHECK: enforce
          CSP_MODE: enforce
        run: node scripts/check-config.mjs --online
      - name: Migration history preflight (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migration-preflight.mjs --db lummet-control-plane-db --remote
      - name: Apply production migrations after history preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migrate.mjs --db lummet-control-plane-db --remote
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
