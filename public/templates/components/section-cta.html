<section class="section" id="{{key}}">
  <div class="container">
    <div class="cta-band reveal">
      <h2>{{title}}</h2>
      {{#if body_html}}<div class="lede prose">{{{body_html}}}</div>{{/if}}
      <div class="cta-actions">
        <a class="btn btn-light btn-lg" href="{{cta_href}}"{{#if cta_external}} target="_blank" rel="noopener noreferrer"{{/if}}>{{cta_label}} {{{icons.arrow}}}</a>
        <a class="btn btn-outline-light btn-lg" href="/pricing">{{ui.cta_see_plans}}</a>
      </div>
    </div>
  </div>
</section>
