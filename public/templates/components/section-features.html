<section class="section bg-{{bg}}" id="{{key}}">
  <div class="container">
    {{> components/section-head}}
    <div class="grid grid-3">
      {{#each items}}
      <div class="card feature-card reveal">
        {{#if icon_svg}}<span class="icon-tile">{{{icon_svg}}}</span>{{/if}}
        <h3>{{title}}</h3>
        {{#if body}}<p>{{body}}</p>{{/if}}
      </div>
      {{/each}}
    </div>
    {{> components/section-foot}}
  </div>
</section>
