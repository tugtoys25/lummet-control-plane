<article>
  <header class="page-hero">
    <div class="container narrow">
      {{> components/breadcrumbs}}
      <h1>{{page.title}}</h1>
      {{#if page.excerpt}}<p class="lede">{{page.excerpt}}</p>{{/if}}
    </div>
  </header>
  <div class="section section-tight">
    <div class="container narrow">
      <div class="prose">{{{page.content_html}}}</div>
      {{#if page.updated_iso}}<p class="updated-note">{{ui.last_updated}} <time datetime="{{page.updated_iso}}">{{page.updated_iso}}</time></p>{{/if}}
    </div>
  </div>
</article>
